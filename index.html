<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFD23F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Purl &amp; Paws">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Purl &amp; Paws</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:opsz,wght@9..40,400..700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column on a yolk-yellow ground, ink-outlined cards with a cat perched on the lead card, tab bar pinned to the bottom. */
:root {
  --yolk: #FFD23F;
  --yolk-deep: #F2B705;
  --ink: #1C1A14;
  --paper: #FFF7DA;
  --cobalt: #2B44E0;
  --muted: #6A5B24;
  --line: rgba(28, 26, 20, .16);
  --moss: #1E7A4E;
  --brick: #C8381F;
  --pink: #F28CA0;
  --on-ink: #FFF7DA;

  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "DM Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  --r: 20px;
  --shadow: 4px 4px 0 var(--ink);
  color-scheme: light;
}

* { box-sizing: border-box; }
html, body { background: var(--yolk); }
body {
  margin: 0;
  padding-inline: 16px;
  color: var(--ink);
  font: 15px/1.5 var(--f-body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
img { max-width: 100%; display: block; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.05; text-wrap: balance; letter-spacing: -0.02em; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

.app { max-width: 520px; margin: 0 auto; padding-block: 14px 120px; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 6px 26px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand svg { width: 38px; height: 38px; }
.wordmark { font-family: var(--f-display); font-weight: 800; font-size: 26px; letter-spacing: -0.04em; line-height: 1; }
.wordmark span { font-weight: 500; }
.today-tag { font: 500 12px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }

/* ---------- shared pieces ---------- */
.card { position: relative; background: var(--paper); border: 2px solid var(--ink); border-radius: var(--r); box-shadow: var(--shadow); }
.eyebrow { font: 700 11px var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.view { display: flex; flex-direction: column; gap: 22px; }
.view-title { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.view-title h1 { font-size: 34px; font-weight: 800; }
.view-title p { color: var(--muted); font-size: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 20px; border-radius: 999px; border: 2px solid var(--ink); font-weight: 700; font-size: 15px; background: var(--paper); transition: transform .12s, box-shadow .12s; }
.btn:active { transform: translate(2px, 2px); box-shadow: none !important; }
.btn-ink { background: var(--ink); color: var(--on-ink); box-shadow: 3px 3px 0 var(--cobalt); }
.btn-cobalt { background: var(--cobalt); color: var(--on-ink); box-shadow: 3px 3px 0 var(--ink); }
.btn-ghost { border-color: transparent; background: transparent; text-decoration: underline; text-underline-offset: 3px; padding: 0 8px; }
.btn-danger { color: var(--brick); border-color: var(--brick); background: var(--paper); }
.btn-block { width: 100%; }
.btn svg { width: 18px; height: 18px; }

.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font: 700 11px var(--f-mono); letter-spacing: .04em; text-transform: uppercase; border: 1.5px solid var(--ink); white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.st-ok { color: var(--moss); border-color: var(--moss); }
.st-ahead { color: var(--cobalt); border-color: var(--cobalt); }
.st-behind, .st-late { color: var(--brick); border-color: var(--brick); }
.st-soon { color: var(--muted); border-color: var(--muted); }
.st-ready { color: var(--on-ink); background: var(--moss); border-color: var(--moss); }
.chip-example { color: var(--muted); border-style: dashed; border-color: var(--muted); }
.chip-example::before { display: none; }

.bar { height: 10px; border-radius: 99px; background: var(--yolk); border: 1.5px solid var(--ink); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .4s ease; }

.perch { position: absolute; top: -37px; right: 26px; width: 108px; pointer-events: none; }
.perch svg { width: 100%; height: auto; display: block; }

/* ---------- inspire ---------- */
.pick { padding: 18px; display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; margin-top: 18px; }
.pick-art { aspect-ratio: 1; max-width: 100%; border-radius: 16px; background: var(--yolk); border: 2px solid var(--ink); display: grid; place-items: center; }
.pick-art svg { width: 82%; height: 82%; }
.pick-body { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.pick-body h2 { font-size: 24px; font-weight: 800; }
.pick-body p { color: var(--muted); font-size: 14px; }
.pick-actions { grid-column: 1 / -1; display: flex; gap: 10px; flex-wrap: wrap; }
.pick-actions .btn { flex: 1 1 140px; }

.filters { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filter { flex: none; padding: 7px 14px; border-radius: 999px; border: 2px solid var(--ink); font-weight: 600; font-size: 14px; background: transparent; }
.filter[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }

.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.pat { display: flex; flex-direction: column; background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; overflow: hidden; transition: transform .15s, box-shadow .15s; }
.pat:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow); }
.pat-art { aspect-ratio: 5 / 4; display: grid; place-items: center; background: var(--tint, var(--yolk-deep)); border-bottom: 2px solid var(--ink); }
.pat-art svg { width: 62%; height: 78%; }
.pat-body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.pat-body h3 { font-size: 17px; font-weight: 700; }
.pat-meta { font: 500 11.5px var(--f-mono); color: var(--muted); }

/* ---------- projects ---------- */
.summary { padding: 18px 18px 16px; margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.summary div { display: flex; flex-direction: column; gap: 2px; }
.summary b { font: 800 32px/1 var(--f-display); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
.summary span { font-size: 12.5px; color: var(--muted); }

.plist { display: flex; flex-direction: column; gap: 14px; }
.pcard { display: grid; grid-template-columns: 64px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px; background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; width: 100%; transition: transform .15s, box-shadow .15s; }
.pcard:hover { transform: translate(-2px, -2px); box-shadow: var(--shadow); }
.pc-art { width: 64px; height: 64px; border-radius: 14px; background: var(--tint, var(--yolk)); border: 2px solid var(--ink); display: grid; place-items: center; }
.pc-art svg { width: 78%; height: 78%; }
.pc-main { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.pc-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pc-top h3 { font-size: 18px; font-weight: 700; }
.pc-next { font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pc-next b { color: var(--ink); }
.pc-pct { font: 800 22px var(--f-display); font-variant-numeric: tabular-nums; }

.empty { padding: 26px 20px 22px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty svg { width: 170px; height: auto; }
.empty h2 { font-size: 22px; }
.empty p { color: var(--muted); max-width: 32ch; }

/* ---------- project detail ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; padding: 6px 0; }
.back svg { width: 18px; height: 18px; }
.phead { padding: 18px; display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }
.ph-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.ph-title { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.ph-title h1 { font-size: 30px; font-weight: 800; }
.ph-title p { color: var(--muted); font-size: 13.5px; }
.ph-title .chips { display: flex; gap: 6px; flex-wrap: wrap; }
.ring { width: 96px; height: 96px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 800 24px var(--f-display); font-variant-numeric: tabular-nums; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 0; padding-top: 14px; border-top: 2px dashed var(--line); }
.facts div { min-width: 0; }
.facts dt { font: 700 10.5px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.facts dd { margin: 2px 0 0; font: 700 16px var(--f-display); font-variant-numeric: tabular-nums; }

.block { display: flex; flex-direction: column; gap: 12px; }
.block-h { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.block-h h2 { font-size: 22px; font-weight: 800; }
.link-btn { font: 700 12px var(--f-mono); letter-spacing: .06em; text-transform: uppercase; padding: 6px 12px; border-radius: 999px; border: 2px solid var(--ink); }

.cal { padding: 14px; background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; display: flex; flex-direction: column; gap: 6px; }
.cal-row { display: grid; grid-template-columns: 34px repeat(7, minmax(0, 1fr)); gap: 6px; align-items: center; }
.cal-row > span { font: 700 10.5px var(--f-mono); color: var(--muted); text-align: center; letter-spacing: .05em; }
.cal-row > span:first-child { text-align: left; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 10px; display: grid; place-items: center; font: 700 12px var(--f-mono); font-variant-numeric: tabular-nums; border: 2px solid var(--ink); background: var(--paper); position: relative; }
.cell.off { border-color: transparent; color: var(--line); background: transparent; font-weight: 500; }
.cell.out { visibility: hidden; }
.cell.k-done { background: var(--ink); color: var(--on-ink); }
.cell.k-part { background: linear-gradient(135deg, var(--ink) 50%, var(--paper) 50%); color: var(--on-ink); }
.cell.k-part span { mix-blend-mode: difference; }
.cell.k-missed { border-color: var(--brick); color: var(--brick); border-style: dashed; }
.cell.k-today { box-shadow: 0 0 0 3px var(--cobalt); }
.cell.k-up { background: var(--yolk); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding-top: 8px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 4px; border: 2px solid var(--ink); display: inline-block; }

.steps { display: flex; flex-direction: column; gap: 10px; padding: 14px; background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; counter-reset: step; }
.step { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; }
.step-n { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font: 700 11px var(--f-mono); }
.step.done .step-n { background: var(--ink); color: var(--on-ink); }
.step-body { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.step-body p { font-weight: 600; font-size: 14px; }
.step .bar { height: 6px; border-width: 1px; }
.step-h { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.days { display: flex; flex-direction: column; gap: 10px; }
.day { background: var(--paper); border: 2px solid var(--ink); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; scroll-margin-top: 20px; }
.day.is-today { box-shadow: 4px 4px 0 var(--cobalt); }
.day.is-done { opacity: .62; }
.day.is-missed { border-color: var(--brick); }
.day-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.day-h h3 { font-size: 16px; font-weight: 700; }
.day-h .mono { font-size: 12px; color: var(--muted); }
.day-h .spacer { flex: 1; }
.tag { font: 700 10.5px var(--f-mono); letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 6px; background: var(--ink); color: var(--on-ink); }
.tag.today { background: var(--cobalt); }
.tag.missed { background: var(--brick); }
.tag.done { background: var(--moss); }
.mini { font: 700 11px var(--f-mono); text-transform: uppercase; letter-spacing: .05em; text-decoration: underline; text-underline-offset: 3px; padding: 4px 2px; }

.task { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; padding: 6px 0; }
.box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--ink); display: grid; place-items: center; background: var(--paper); transition: background .15s; }
.box svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; }
.task[aria-pressed="true"] .box { background: var(--ink); }
.task[aria-pressed="true"] .box svg { opacity: 1; }
.task[aria-pressed="true"] .t-name { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--muted); }
.t-name { font-weight: 600; font-size: 14.5px; display: block; }
.t-part { font: 500 11.5px var(--f-mono); color: var(--muted); }
.t-h { font: 500 12px var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums; }

.actions { display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
.confirm { display: flex; flex-direction: column; gap: 10px; padding: 14px; border: 2px dashed var(--brick); border-radius: 16px; }
.confirm p { font-weight: 600; }
.confirm div { display: flex; gap: 10px; flex-wrap: wrap; }
.confirm .btn { flex: 1 1 120px; }

/* ---------- archive ---------- */
.shelf { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.frame { display: flex; flex-direction: column; background: var(--paper); border: 2px solid var(--ink); border-radius: 18px; overflow: hidden; padding: 8px 8px 10px; gap: 8px; transition: transform .15s, box-shadow .15s; }
.frame:hover { transform: translate(-2px, -2px) rotate(-1deg); box-shadow: var(--shadow); }
.frame-img { aspect-ratio: 1; max-width: 100%; border-radius: 12px; background: var(--tint, var(--yolk-deep)); display: grid; place-items: center; overflow: hidden; }
.frame-img img { width: 100%; height: 100%; object-fit: cover; }
.frame-img svg { width: 60%; height: 60%; }
.frame h3 { font-size: 16px; font-weight: 700; padding-inline: 4px; }
.frame p { font: 500 11.5px var(--f-mono); color: var(--muted); padding-inline: 4px; }

/* ---------- tab bar ---------- */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; }
.tabs-in { pointer-events: auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; width: 100%; max-width: 400px; padding: 6px; background: var(--ink); border-radius: 999px; box-shadow: 0 8px 24px rgba(28, 26, 20, .25); }
.tab { display: flex; align-items: center; justify-content: center; gap: 7px; min-height: 46px; border-radius: 999px; color: var(--on-ink); font-weight: 700; font-size: 14px; }
.tab svg { width: 20px; height: 20px; flex: none; }
.tab[aria-current="page"] { background: var(--yolk); color: var(--ink); }
.tab .count { font: 700 11px var(--f-mono); opacity: .7; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(28, 26, 20, .45); z-index: 30; animation: fade .2s ease; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; display: flex; justify-content: center; pointer-events: none; }
.sheet-in { pointer-events: auto; width: 100%; max-width: 560px; max-height: 92vh; max-height: 92dvh; overflow-y: auto; overscroll-behavior: contain; background: var(--paper); border: 2px solid var(--ink); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 10px 20px calc(24px + env(safe-area-inset-bottom, 0px)); animation: rise .28s cubic-bezier(.2, .9, .3, 1.1); }
.grab { width: 44px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 10px; }
.sheet-close { position: sticky; top: 0; float: right; width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; background: var(--paper); z-index: 2; }
.sheet-close svg { width: 16px; height: 16px; }
.sheet-body { display: flex; flex-direction: column; gap: 18px; clear: both; }
.sheet-hero { aspect-ratio: 16 / 10; max-width: 100%; border-radius: 18px; border: 2px solid var(--ink); background: var(--tint, var(--yolk)); display: grid; place-items: center; overflow: hidden; }
.sheet-hero svg { width: 48%; height: 80%; }
.sheet-hero img { width: 100%; height: 100%; object-fit: cover; }
.sheet h2 { font-size: 28px; font-weight: 800; }
.sheet .lede { color: var(--muted); }
.specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
.specs div { padding: 10px 12px; border-radius: 12px; background: var(--yolk); border: 1.5px solid var(--ink); min-width: 0; }
.specs dt { font: 700 10px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.specs dd { margin: 2px 0 0; font-weight: 700; font-size: 14px; }
.steplist { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-top: 2px solid var(--ink); }
.steplist li { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; gap: 8px; padding: 9px 0; border-bottom: 1.5px dashed var(--line); font-size: 14.5px; }
.steplist .n { font: 700 12px var(--f-mono); color: var(--muted); padding-top: 2px; }
.steplist .h { font: 500 12px var(--f-mono); color: var(--muted); }
.sheet h3 { font-size: 18px; font-weight: 800; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > label, .field > .lbl { font: 700 11px var(--f-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.input { min-height: 48px; padding: 10px 14px; border-radius: 14px; border: 2px solid var(--ink); background: var(--paper); width: 100%; font-size: 16px; }
textarea.input { min-height: 84px; resize: vertical; }
.stepper { display: flex; align-items: center; gap: 12px; }
.stepper button { width: 46px; height: 46px; border-radius: 50%; border: 2px solid var(--ink); display: grid; place-items: center; font: 700 22px var(--f-mono); flex: none; }
.stepper output { font: 800 34px var(--f-display); min-width: 3ch; text-align: center; font-variant-numeric: tabular-nums; }
.stepper small { color: var(--muted); font-size: 14px; }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wk button { display: grid; place-items: center; aspect-ratio: 1; max-width: 100%; border-radius: 12px; border: 2px solid var(--ink); font: 700 13px var(--f-mono); }
.wk button[aria-pressed="true"] { background: var(--ink); color: var(--on-ink); }
.plan-preview { padding: 14px; border-radius: 16px; background: var(--yolk); border: 2px solid var(--ink); display: flex; flex-direction: column; gap: 10px; }
.plan-preview .big { font: 800 20px/1.2 var(--f-display); letter-spacing: -0.02em; }
.plan-preview ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 6px; }
.plan-preview li { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; font-size: 13.5px; }
.plan-preview li .mono { font-size: 12px; color: var(--muted); }
.warn { color: var(--brick); font-weight: 600; font-size: 14px; }

.drop { display: grid; place-items: center; gap: 8px; padding: 22px 16px; border: 2.5px dashed var(--ink); border-radius: 18px; background: var(--yolk); text-align: center; cursor: pointer; min-height: 200px; overflow: hidden; }
.drop svg { width: 120px; height: auto; }
.drop b { font-family: var(--f-display); font-size: 18px; }
.drop span { color: var(--muted); font-size: 13.5px; }
.drop.has-photo { padding: 0; border-style: solid; }
.drop img { width: 100%; max-height: 360px; object-fit: cover; }

.toast { position: fixed; left: 50%; width: max-content; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--on-ink); padding: 12px 18px; border-radius: 999px; font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; box-shadow: 3px 3px 0 var(--cobalt); animation: rise .25s ease; max-width: calc(100% - 32px); }
.toast svg { width: 22px; height: 22px; flex: none; }

@keyframes rise { from { transform: translateY(24px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
.toast { animation-name: toastIn; }
@keyframes toastIn { from { transform: translate(-50%, 16px); opacity: 0; } }
.tail { transform-origin: 20px 60px; animation: swish 3.2s ease-in-out infinite; }
@keyframes swish { 50% { transform: rotate(-12deg); } }

/* ---------- project detail columns ---------- */
.pdetail, .pcol { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

/* ---------- tablet and desktop: use the whole screen ---------- */
@media (min-width: 760px) {
  body { font-size: 16px; padding-inline: 28px; }
  .app { max-width: 1100px; padding-block: 22px 130px; }
  .top { padding-block: 6px 34px; }
  .wordmark { font-size: 32px; }
  .brand svg { width: 46px; height: 46px; }
  .today-tag { font-size: 13px; }
  .view { gap: 28px; }
  .view-title h1 { font-size: 48px; }
  .perch { width: 132px; top: -45px; right: 36px; }

  .pick { grid-template-columns: 220px minmax(0, 1fr); gap: 28px; padding: 26px; }
  .pick-body h2 { font-size: 36px; }
  .pick-body p { font-size: 16px; }
  .pick-actions { grid-column: 2; }
  .pick-actions .btn { flex: 0 1 200px; }
  .filter { font-size: 15px; padding: 9px 18px; }
  .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .pat-body { padding: 14px 16px 16px; }
  .pat-body h3 { font-size: 20px; }
  .pat-meta { font-size: 12.5px; }

  .summary { padding: 24px 26px; }
  .summary b { font-size: 46px; }
  .summary span { font-size: 14px; }
  .plist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
  .pcard { grid-template-columns: 84px minmax(0, 1fr) auto; padding: 18px; }
  .pc-art { width: 84px; height: 84px; }
  .pc-top h3 { font-size: 21px; }
  .pc-next { font-size: 14px; }
  .pc-pct { font-size: 28px; }

  .pdetail { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .phead { padding: 24px; }
  .ph-title h1 { font-size: 40px; }
  .ring { width: 120px; height: 120px; }
  .ring b { font-size: 30px; }
  .facts dd { font-size: 20px; }
  .block-h h2 { font-size: 26px; }
  .cell { font-size: 14px; border-radius: 12px; }
  .cal { padding: 18px; gap: 8px; }
  .cal-row { gap: 8px; grid-template-columns: 40px repeat(7, minmax(0, 1fr)); }
  .t-name { font-size: 16px; }
  .day { padding: 14px 18px; }
  .day-h h3 { font-size: 18px; }

  .shelf { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
  .frame h3 { font-size: 19px; }

  .tabs { padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
  .tabs-in { max-width: 480px; }
  .tab { min-height: 52px; font-size: 15px; }
  .toast { bottom: calc(104px + env(safe-area-inset-bottom, 0px)); }

  .sheet { align-items: center; top: 0; padding: 24px; }
  .sheet-in { max-width: 640px; max-height: 88vh; max-height: 88dvh; border-bottom: 2px solid var(--ink); border-radius: 26px; box-shadow: 6px 6px 0 var(--ink); padding: 14px 28px 28px; }
  .grab { display: none; }
  .sheet-hero { aspect-ratio: auto; height: 240px; }
  .sheet-hero:has(img) { height: auto; max-height: 60vh; }
  .sheet h2 { font-size: 34px; }
}
@media (min-width: 1100px) {
  .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .shelf { grid-template-columns: repeat(4, minmax(0, 1fr)); }

@media (max-width: 380px) {

  .ring { width: 80px; height: 80px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }

/* ================= dates ================= */
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromIso = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const today = () => isoOf(new Date());
const fmtDay = s => fromIso(s).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const fmtShort = s => fromIso(s).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
const fmtLong = s => fromIso(s).toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
const daysBetween = (a, b) => Math.round((fromIso(b) - fromIso(a)) / 864e5);
const fmtH = h => h < 1 ? `${Math.max(5, Math.round(h * 60 / 5) * 5)} min` : `${Math.round(h * 2) / 2} h`;
const WEEK = [1, 2, 3, 4, 5, 6, 0];
const WD = { 0: "S", 1: "M", 2: "T", 3: "W", 4: "T", 5: "F", 6: "S" };
const WDLONG = { 0: "Sun", 1: "Mon", 2: "Tue", 3: "Wed", 4: "Thu", 5: "Fri", 6: "Sat" };

/* ================= planner =================
   Every knitting day gets an equal slice of the pattern's total hours.
   Steps are laid end to end on that hour line, and each day takes whatever
   steps fall inside its slice, so long steps split into numbered parts. */
function knittingDays(start, weeks, weekdays) {
  const out = [], s = fromIso(start);
  for (let i = 0; i < weeks * 7; i++) { const d = addDays(s, i); if (weekdays.includes(d.getDay())) out.push(isoOf(d)); }
  return out;
}
function buildPlan(p, start, weeks, weekdays) {
  const days = knittingDays(start, weeks, weekdays);
  if (!days.length) return { days, tasks: [] };
  const H = totalHours(p), per = H / days.length, eps = 1e-6;
  const tasks = [];
  let a = 0;
  p.steps.forEach(([name, h], si) => {
    const b = a + h, chunk = [];
    const first = Math.floor(a / per + eps), last = Math.min(days.length - 1, Math.ceil(b / per - eps) - 1);
    for (let d = first; d <= last; d++) {
      const ov = Math.min(b, (d + 1) * per) - Math.max(a, d * per);
      if (ov > eps) chunk.push({ day: d, hours: ov });
    }
    chunk.forEach((c, k) => tasks.push({ id: `${si}-${k}`, step: si, name, day: c.day, hours: c.hours, part: k + 1, parts: chunk.length, done: false }));
    a = b;
  });
  return { days, tasks };
}
function createProject(p, o) {
  const plan = buildPlan(p, o.start, o.weeks, o.weekdays);
  return { id: "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6), patternId: p.id, name: o.name || p.name,
    start: o.start, weeks: o.weeks, weekdays: o.weekdays, days: plan.days, tasks: plan.tasks,
    status: "active", createdAt: today(), finishedAt: null, note: "", hasPhoto: false };
}
function stats(pr) {
  const t = today(), tasks = pr.tasks;
  const total = tasks.reduce((s, x) => s + x.hours, 0) || 1;
  const done = tasks.reduce((s, x) => s + (x.done ? x.hours : 0), 0);
  const before = tasks.reduce((s, x) => s + (pr.days[x.day] < t ? x.hours : 0), 0);
  const through = tasks.reduce((s, x) => s + (pr.days[x.day] <= t ? x.hours : 0), 0);
  const per = total / pr.days.length, pct = done / total;
  let st;
  if (pct > 0.999) st = { key: "ready", label: "Ready to bind off" };
  else if (t < pr.days[0]) st = { key: "soon", label: "Starts " + fmtShort(pr.days[0]) };
  else if (t > pr.days[pr.days.length - 1]) st = { key: "late", label: "Past finish date" };
  else if (done > through + 0.01) st = { key: "ahead", label: "Ahead of plan" };
  else if (done >= before - 0.01) st = { key: "ok", label: "On track" };
  else { const n = Math.ceil((before - done) / per - 0.05); st = { key: "behind", label: `Behind by ${n} session${n > 1 ? "s" : ""}` }; }
  const next = tasks.filter(x => !x.done).sort((x, y) => x.day - y.day)[0] || null;
  const session = pr.days.filter(d => d <= t).length;
  return { total, done, pct, st, next, session, per };
}

/* ================= storage ================= */
const KEY = "purlpaws.v1";
let DB = { projects: [], seeded: false };
try { const raw = localStorage.getItem(KEY); if (raw) DB = Object.assign(DB, JSON.parse(raw)); } catch (e) { /* storage blocked: keep in memory */ }
function save() { try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) { /* ignore */ } }

const Photos = (() => {
  const mem = new Map(); let dbp = null;
  function open() {
    if (!dbp) dbp = new Promise((res, rej) => {
      try { const r = indexedDB.open("purlpaws-photos", 1); r.onupgradeneeded = () => r.result.createObjectStore("photos"); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }
      catch (e) { rej(e); }
    });
    return dbp;
  }
  async function run(mode, fn) {
    const db = await open();
    return new Promise((res, rej) => { const tx = db.transaction("photos", mode); const q = fn(tx.objectStore("photos")); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); });
  }
  return {
    async put(id, url) { mem.set(id, url); try { await run("readwrite", s => s.put(url, id)); } catch (e) { /* memory only */ } },
    async get(id) { if (mem.has(id)) return mem.get(id); try { const v = await run("readonly", s => s.get(id)); if (v) mem.set(id, v); return v || null; } catch (e) { return null; } },
    async del(id) { mem.delete(id); try { await run("readwrite", s => s.delete(id)); } catch (e) { /* ignore */ } }
  };
})();

function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const max = 1400, k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.84));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("That file could not be opened as a photo. Try a JPG or PNG.")); };
    img.src = url;
  });
}

/* Example projects on first launch, so the app opens showing what it does. */
function seed() {
  if (DB.seeded) return;
  const t = new Date(), T = today();
  const a = createProject(pat("sunday-raglan"), { start: isoOf(addDays(t, -12)), weeks: 6, weekdays: [1, 2, 4, 6, 0] });
  const pastA = [...new Set(a.tasks.filter(x => a.days[x.day] < T).map(x => x.day))];
  a.tasks.forEach(x => { if (a.days[x.day] < T && x.day !== pastA[pastA.length - 1]) x.done = true; });
  const b = createProject(pat("fisherman-beanie"), { start: isoOf(addDays(t, -3)), weeks: 2, weekdays: [0, 1, 2, 3, 4, 5, 6] });
  b.tasks.forEach(x => { if (b.days[x.day] <= isoOf(addDays(t, 1))) x.done = true; });
  const c = createProject(pat("seed-scarf"), { start: isoOf(addDays(t, -48)), weeks: 4, weekdays: [1, 3, 5, 6] });
  c.tasks.forEach(x => x.done = true); c.status = "done"; c.finishedAt = isoOf(addDays(t, -19));
  c.note = "Gave it to Mum for her birthday. Her cat claimed it first.";
  [a, b, c].forEach(x => x.example = true);
  DB.projects = [a, b, c]; DB.seeded = true; save();
}

function ring(pct) {
  const r = 40, c = 2 * Math.PI * r;
  return `<div class="ring" role="img" aria-label="${Math.round(pct * 100)} percent done"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="${r}" fill="none" stroke="#FFD23F" stroke-width="12"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="#1C1A14" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct)}" style="transition:stroke-dashoffset .5s"/><circle cx="50" cy="50" r="${r + 7.5}" fill="none" stroke="#1C1A14" stroke-width="2"/><circle cx="50" cy="50" r="${r - 7.5}" fill="none" stroke="#1C1A14" stroke-width="2"/></svg><b>${Math.round(pct * 100)}%</b></div>`;
}

function dayState(p, i) {
  const ts = p.tasks.filter(t => t.day === i), d = p.days[i], t = today();
  const done = ts.filter(x => x.done).length;
  if (ts.length && done === ts.length) return "done";
  if (d < t) return "missed";
  if (done) return "part";
  if (d === t) return "today";
  return "up";
}

function calendar(p) {
  const s = fromIso(p.days[0]), e = fromIso(p.days[p.days.length - 1]);
  const mon = addDays(s, -((s.getDay() + 6) % 7));
  const idx = new Map(p.days.map((d, i) => [d, i]));
  const T = today(), startIso = p.start, endIso = isoOf(addDays(fromIso(p.start), p.weeks * 7 - 1));
  let rows = `<div class="cal-row"><span></span>${WEEK.map(d => `<span>${WD[d]}</span>`).join("")}</div>`;
  for (let w = mon, n = 1; w <= e; w = addDays(w, 7), n++) {
    let cells = "";
    for (let k = 0; k < 7; k++) {
      const d = isoOf(addDays(w, k)), num = fromIso(d).getDate();
      if (d < startIso || d > endIso) { cells += `<span class="cell out" aria-hidden="true"></span>`; continue; }
      if (!idx.has(d)) { cells += `<span class="cell off${d === T ? " k-today" : ""}" aria-hidden="true">${num}</span>`; continue; }
      const st = dayState(p, idx.get(d));
      cells += `<button class="cell k-${st}${d === T ? " k-today" : ""}" data-act="jump" data-day="${d}" aria-label="${fmtDay(d)}: ${st === "up" || st === "today" ? "planned" : st === "part" ? "partly done" : st}"><span>${num}</span></button>`;
    }
    rows += `<div class="cal-row"><span>W${n}</span>${cells}</div>`;
  }
  return `<div class="cal">${rows}
    <div class="legend"><span><i style="background:#1C1A14"></i>Done</span><span><i style="background:linear-gradient(135deg,#1C1A14 50%,#FFF7DA 50%)"></i>Started</span><span><i style="background:#FFD23F"></i>Planned</span><span><i style="border-color:#C8381F;border-style:dashed"></i>Missed</span><span><i style="box-shadow:0 0 0 2px #2B44E0"></i>Today</span></div></div>`;
}

function viewProject(p) {
  const pt = pat(p.patternId), s = stats(p), T = today();
  const isDone = p.status === "done";
  const stepRows = pt.steps.map(([name, h], si) => {
    const ts = p.tasks.filter(t => t.step === si), tot = ts.reduce((a, t) => a + t.hours, 0) || 1, dn = ts.reduce((a, t) => a + (t.done ? t.hours : 0), 0);
    const range = ts.length ? (ts.length > 1 ? `${fmtShort(p.days[ts[0].day])} to ${fmtShort(p.days[ts[ts.length - 1].day])}` : fmtShort(p.days[ts[0].day])) : "";
    return `<div class="step${dn / tot > 0.999 ? " done" : ""}"><span class="step-n">${dn / tot > 0.999 ? "✓" : si + 1}</span><div class="step-body"><p>${name}</p><div class="bar"><i style="width:${dn / tot * 100}%"></i></div></div><span class="step-h">${range}</span></div>`;
  }).join("");
  const hidePast = !S.showPast && !isDone;
  const pastDone = p.days.filter((d, i) => d < T && dayState(p, i) === "done").length;
  const days = p.days.map((d, i) => {
    const ts = p.tasks.filter(t => t.day === i); if (!ts.length) return "";
    const st = dayState(p, i), hrs = ts.reduce((a, t) => a + t.hours, 0);
    const tag = d === T ? `<span class="tag today">Today</span>` : st === "done" ? `<span class="tag done">Done</span>` : st === "missed" ? `<span class="tag missed">Missed</span>` : "";
    const cls = d === T ? " is-today" : st === "done" ? " is-done" : st === "missed" ? " is-missed" : "";
    if (hidePast && d < T && st === "done") return "";
    return `<article class="day${cls}" id="d-${d}">
      <div class="day-h"><h3>${fmtDay(d)}</h3><span class="mono">Session ${i + 1} · ${fmtH(hrs)}</span>${tag}<span class="spacer"></span>${st !== "done" && !isDone ? `<button class="mini" data-act="day-done" data-i="${i}">Mark day done</button>` : ""}</div>
      ${ts.map(t => `<button class="task" data-act="toggle" data-t="${t.id}" aria-pressed="${t.done}"${isDone ? " disabled" : ""}><span class="box">${ICON.check}</span><span><span class="t-name">${t.name}</span>${t.parts > 1 ? `<span class="t-part">Part ${t.part} of ${t.parts}</span>` : ""}</span><span class="t-h">${fmtH(t.hours)}</span></button>`).join("")}
    </article>`;
  }).join("");
  const endIso = p.days[p.days.length - 1];
  return `
    <button class="back" data-act="back">${ICON.back} ${isDone ? "Archive" : "All projects"}</button>
    <div class="pdetail"><div class="pcol">
    <section class="card phead">
      <div class="perch">${CAT_PEEK}</div>
      <div class="ph-row">
        <div class="ph-title">
          <span class="eyebrow">${pt.id === "freestyle" ? "Own pattern" : pt.name} · ${pt.yarn}</span>
          <h1>${esc(p.name)}</h1>
          <div class="chips">${isDone ? `<span class="chip st-ready">Finished ${fmtShort(p.finishedAt)}</span>` : `<span class="chip st-${s.st.key}">${s.st.label}</span>`}${p.example ? `<span class="chip chip-example">Example</span>` : ""}</div>
        </div>
        ${ring(s.pct)}
      </div>
      <dl class="facts">
        <div><dt>Session</dt><dd>${Math.min(s.session, p.days.length)} / ${p.days.length}</dd></div>
        <div><dt>Knitted</dt><dd>${Math.round(s.done * 2) / 2} / ${Math.round(s.total)} h</dd></div>
        <div><dt>Finish by</dt><dd>${fmtShort(endIso)}</dd></div>
      </dl>
    </section>
    <section class="block">
      <div class="block-h"><h2>Timeline</h2>${T >= p.days[0] && T <= endIso && !isDone ? `<button class="link-btn" data-act="jump" data-day="${p.days.find(d => d >= T) || endIso}">Jump to today</button>` : ""}</div>
      ${calendar(p)}
    </section>
    <section class="block"><div class="block-h"><h2>Steps</h2><span class="eyebrow">${pt.steps.length} steps</span></div><div class="steps">${stepRows}</div></section>
    </div><div class="pcol">
    <section class="block"><div class="block-h"><h2>Day by day</h2><span class="eyebrow">${p.weeks} week${p.weeks > 1 ? "s" : ""}</span></div><div class="days">${!isDone && pastDone ? `<button class="link-btn" data-act="past" style="align-self:flex-start">${S.showPast ? "Hide" : "Show"} ${pastDone} finished session${pastDone > 1 ? "s" : ""}</button>` : ""}${days}</div></section>
    <section class="actions">
      ${isDone ? "" : `<button class="btn ${s.pct > 0.999 ? "btn-cobalt" : "btn-ink"} btn-block" data-act="finish">${ICON.camera} ${s.pct > 0.999 ? "Bind off, take a photo and archive" : "Finish early and archive"}</button>`}
      ${S.confirmDelete ? `<div class="confirm"><p>Delete "${esc(p.name)}" and its progress? This cannot be undone.</p><div><button class="btn btn-danger" data-act="delete-yes">Delete project</button><button class="btn" data-act="delete-no">Keep it</button></div></div>`
        : `<button class="btn btn-ghost" data-act="delete" style="align-self:center">Delete project</button>`}
    </section>
    </div></div>`;
}

/* ---------- archive ---------- */
function viewArchive() {
  const list = archived();
  const hours = list.reduce((a, p) => a + p.tasks.reduce((s, t) => s + t.hours, 0), 0);
  if (!list.length) return `
    <div class="view-title"><h1>Finished knits</h1></div>
    <section class="card empty">${CAT_PLAY}<h2>Your shelf is empty</h2><p>When you bind off a project, snap a photo and it lands here.</p></section>`;
  return `
    <div class="view-title"><h1>Finished knits</h1><p class="mono">${list.length} done · ${Math.round(hours)} h</p></div>
    <section class="shelf">
      ${list.map(p => { const pt = pat(p.patternId); return `
        <button class="frame" data-act="archived" data-id="${p.id}">
          <div class="frame-img" style="--tint:${pt.tint}" data-photo="${p.hasPhoto ? p.id : ""}">${garment(pt.shape, pt.color)}</div>
          <h3>${esc(p.name)}</h3>
          <p>${fmtShort(p.finishedAt)} · ${Math.max(1, daysBetween(p.start, p.finishedAt))} day${Math.max(1, daysBetween(p.start, p.finishedAt)) === 1 ? "" : "s"}${p.example ? " · example" : ""}</p>
        </button>`; }).join("")}
    </section>`;
}
async function fillPhotos() {
  for (const el of document.querySelectorAll("[data-photo]")) {
    const id = el.dataset.photo; if (!id) continue;
    const url = await Photos.get(id);
    if (url && el.isConnected) el.innerHTML = `<img src="${url}" alt="">`;
  }
}
async function archivedSheet(id) {
  const p = getP(id); if (!p) return;
  const pt = pat(p.patternId), hrs = p.tasks.reduce((s, t) => s + t.hours, 0);
  const photo = p.hasPhoto ? await Photos.get(p.id) : null;
  openSheet(`
    <div class="sheet-hero" style="--tint:${pt.tint};aspect-ratio:${photo ? "4/5" : "16/10"}">${photo ? `<img src="${photo}" alt="Photo of ${esc(p.name)}">` : garment(pt.shape, pt.color)}</div>
    <div style="display:flex;flex-direction:column;gap:8px"><span class="eyebrow">${pt.id === "freestyle" ? "Own pattern" : pt.name}${p.example ? " · example" : ""}</span><h2>${esc(p.name)}</h2>
      ${p.note ? `<p class="lede">${esc(p.note)}</p>` : ""}</div>
    <dl class="specs">
      <div><dt>Cast on</dt><dd>${fmtLong(p.start)}</dd></div>
      <div><dt>Bound off</dt><dd>${fmtLong(p.finishedAt)}</dd></div>
      <div><dt>Knitting time</dt><dd>${Math.round(hrs)} h over ${p.days.length} sessions</dd></div>
      <div><dt>Yarn</dt><dd>${pt.yarn}</dd></div>
    </dl>
    <button class="btn" data-act="open-done" data-id="${p.id}">See the full timeline</button>
    <div id="arcDel"><button class="btn btn-ghost btn-block" data-act="arc-delete">Remove from archive</button></div>`);
  SHEET_CTX = { id };
}

/* ---------- finish ---------- */
let SHEET_CTX = null;
function finishSheet(id) {
  const p = getP(id);
  SHEET_CTX = { id, photo: null };
  openSheet(`
    <div style="display:flex;flex-direction:column;gap:6px"><span class="eyebrow">Bind off</span><h2>${esc(p.name)} is done!</h2><p class="lede">Take a photo of your finished piece. It goes on your archive shelf.</p></div>
    <label class="drop" id="drop" for="photoIn">${CAT_PLAY}<b>Take or choose a photo</b><span>Opens your camera on a phone</span></label>
    <input class="sr" id="photoIn" type="file" accept="image/*" capture="environment">
    <p class="warn" id="photoErr" hidden></p>
    <div class="field"><label for="f-note">A note for future you (optional)</label><textarea class="input" id="f-note" maxlength="280" placeholder="Yarn colour, who it is for, what you would change next time"></textarea></div>
    <button class="btn btn-cobalt btn-block" data-act="archive-save">Save to archive</button>`);
  $("#photoIn").addEventListener("change", async e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const err = $("#photoErr"); err.hidden = true;
    try { SHEET_CTX.photo = await compress(f); const d = $("#drop"); d.classList.add("has-photo"); d.innerHTML = `<img src="${SHEET_CTX.photo}" alt="Your finished project">`; }
    catch (x) { err.textContent = x.message; err.hidden = false; }
  });
}

/* ---------- sheet + toast ---------- */
let lastFocus = null;
function openSheet(html) {
  lastFocus = document.activeElement;
  $("#sheetBody").innerHTML = html;
  $("#scrim").hidden = false; $("#sheet").hidden = false;
  $(".sheet-in").scrollTop = 0;
  document.body.style.overflow = "hidden";
  setTimeout(() => $(".sheet-close").focus({ preventScroll: true }), 30);
}
function closeSheet() {
  $("#scrim").hidden = true; $("#sheet").hidden = true; document.body.style.overflow = "";
  SETUP = null; SHEET_CTX = null;
  if (lastFocus && lastFocus.isConnected) lastFocus.focus({ preventScroll: true });
}
let toastT;
function toast(msg) {
  const t = $("#toast"); t.innerHTML = CAT_HAPPY + `<span>${esc(msg)}</span>`; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600);
}

function rerenderKeepScroll() { const y = window.scrollY; render(); window.scrollTo(0, y); }

/* ================= events ================= */
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });
document.addEventListener("click", async e => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case "tab": if (!$("#sheet").hidden) closeSheet(); go(d.tab); break;
    case "filter": S.filter = d.f; rerenderKeepScroll(); break;
    case "shuffle": { const pool = PATTERNS.filter(p => p.id !== "freestyle" && p.id !== S.pick); S.pick = pool[Math.floor(Math.random() * pool.length)].id; rerenderKeepScroll(); break; }
    case "pattern": patternSheet(d.id); break;
    case "setup": setupSheet(d.id); break;
    case "weeks": SETUP.weeks = Math.max(1, Math.min(26, SETUP.weeks + +d.d)); updatePreview(); break;
    case "wd": { const n = +d.d, w = SETUP.weekdays; SETUP.weekdays = w.includes(n) ? w.filter(x => x !== n) : [...w, n]; updatePreview(); break; }
    case "cast-on": {
      const { p, start, weeks, weekdays } = SETUP;
      const name = (SETUP.name || "").trim() || (p.id === "freestyle" ? "My project" : p.name);
      const pr = createProject(p, { name, start, weeks, weekdays });
      DB.projects.unshift(pr); save(); closeSheet();
      S.tab = "projects"; S.projectId = pr.id; render(); window.scrollTo(0, 0);
      toast(`Cast on! ${pr.days.length} sessions planned.`); break;
    }
    case "project": S.projectId = d.id; S.confirmDelete = false; render(); window.scrollTo(0, 0); break;
    case "back": { const wasDone = getP(S.projectId)?.status === "done"; go(wasDone ? "archive" : "projects"); break; }
    case "toggle": {
      const p = getP(S.projectId), t = p.tasks.find(x => x.id === d.t); t.done = !t.done;
      save();
      const before = stats(p).pct; rerenderKeepScroll();
      if (t.done && before > 0.999) toast("Every stitch done. Time for a photo!");
      break;
    }
    case "day-done": { const p = getP(S.projectId); p.tasks.forEach(t => { if (t.day === +d.i) t.done = true; }); save(); rerenderKeepScroll(); toast(stats(p).pct > 0.999 ? "Every stitch done. Time for a photo!" : "Day done. Good kitty."); break; }
    case "jump": { if (!document.getElementById("d-" + d.day)) { S.showPast = true; rerenderKeepScroll(); } const t = document.getElementById("d-" + d.day); if (t) t.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" }); break; }
    case "past": S.showPast = !S.showPast; rerenderKeepScroll(); break;
    case "finish": finishSheet(S.projectId); break;
    case "archive-save": {
      const p = getP(SHEET_CTX.id), photo = SHEET_CTX.photo;
      p.note = ($("#f-note").value || "").trim(); p.status = "done"; p.finishedAt = today();
      if (photo) { await Photos.put(p.id, photo); p.hasPhoto = true; }
      save(); closeSheet(); go("archive"); toast("Bound off and saved to your archive."); break;
    }
    case "delete": S.confirmDelete = true; rerenderKeepScroll(); break;
    case "delete-no": S.confirmDelete = false; rerenderKeepScroll(); break;
    case "delete-yes": { const id = S.projectId; DB.projects = DB.projects.filter(x => x.id !== id); Photos.del(id); save(); go("projects"); toast("Project deleted."); break; }
    case "archived": archivedSheet(d.id); break;
    case "open-done": { const id = d.id; closeSheet(); S.projectId = id; render(); window.scrollTo(0, 0); break; }
    case "arc-delete": $("#arcDel").innerHTML = `<div class="confirm"><p>Remove this project and its photo for good?</p><div><button class="btn btn-danger" data-act="arc-delete-yes">Remove</button><button class="btn" data-act="arc-delete-no">Keep it</button></div></div>`; break;
    case "arc-delete-no": $("#arcDel").innerHTML = `<button class="btn btn-ghost btn-block" data-act="arc-delete">Remove from archive</button>`; break;
    case "arc-delete-yes": { const id = SHEET_CTX.id; DB.projects = DB.projects.filter(x => x.id !== id); Photos.del(id); save(); closeSheet(); render(); toast("Removed from archive."); break; }
    case "close-sheet": closeSheet(); break;
  }
});

/* ================= boot ================= */
seed();
const h = (location.hash || "").slice(1);
S.tab = ["inspire", "projects", "archive"].includes(h) ? h : (active().length ? "projects" : "inspire");
render();
})();
</script>
</body>
</html>
